name: Build and Release OTA Firmware

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'platformio.ini'
      - 'scripts/**'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware
        # Pass FIRMWARE_VERSION env var so it gets compiled into the binary
        env:
          PLATFORMIO_BUILD_FLAGS: -DFIRMWARE_VERSION=\"1.0.${{ github.run_number }}\"
        run: pio run -e esp32dev

      - name: Get Version info
        id: version
        run: |
          echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Firmware Update v${{ steps.version.outputs.VERSION }}
          body: "Automated OTA firmware release from CI/CD pipeline."
          draft: false
          prerelease: false
          files: .pio/build/esp32dev/firmware.bin
          token: ${{ secrets.GITHUB_TOKEN }}
