name: Build and Release OTA Firmware

on:
  push:
    branches:
      - master
      - main
      - development
      - dev
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'platformio.ini'
      - 'scripts/**'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware
        # Pass FIRMWARE_VERSION and Firebase credentials as env vars.
        # load_env.py reads FIREBASE_HOST and FIREBASE_AUTH from the environment
        # when no .env file is present (CI environment).
        env:
          PLATFORMIO_BUILD_FLAGS: -DFIRMWARE_VERSION=\"1.0.${{ github.run_number }}\"
          FIREBASE_HOST: ${{ secrets.FIREBASE_HOST }}
          FIREBASE_AUTH: ${{ secrets.FIREBASE_AUTH }}
          GOOGLE_SHEETS_LOGGING_ENABLED: ${{ secrets.GOOGLE_SHEETS_LOGGING_ENABLED }}
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          GOOGLE_SHEETS_SHARED_SECRET: ${{ secrets.GOOGLE_SHEETS_SHARED_SECRET }}
        run: pio run -e esp32dev

      - name: Get Version info
        id: version
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.${{ github.run_number }}-dev" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Firmware Update v${{ steps.version.outputs.VERSION }}
          body: "Automated OTA firmware release from CI/CD pipeline."
          draft: false
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}
          files: .pio/build/esp32dev/firmware.bin
          token: ${{ secrets.GITHUB_TOKEN }}
