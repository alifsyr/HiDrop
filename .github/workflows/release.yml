name: Build and Release OTA Firmware

on:
  push:
    branches:
      - development
      - dev
  release:
    types: [published]
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'platformio.ini'
      - 'scripts/**'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Get Version info
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Remove the 'v' prefix from the release tag
            RAW_TAG="${{ github.event.release.tag_name }}"
            echo "VERSION=${RAW_TAG#v}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "IS_RELEASE_EVENT=true" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.${{ github.run_number }}-dev" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "IS_RELEASE_EVENT=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Firmware
        env:
          PLATFORMIO_BUILD_FLAGS: -DFIRMWARE_VERSION=\"${{ steps.version.outputs.VERSION }}\"
          FIREBASE_HOST: ${{ secrets.FIREBASE_HOST }}
          FIREBASE_AUTH: ${{ secrets.FIREBASE_AUTH }}
          GOOGLE_SHEETS_LOGGING_ENABLED: ${{ secrets.GOOGLE_SHEETS_LOGGING_ENABLED }}
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          GOOGLE_SHEETS_SHARED_SECRET: ${{ secrets.GOOGLE_SHEETS_SHARED_SECRET }}
        run: pio run -e esp32dev

      - name: Create or Update Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          # If it's a release event, we don't need to specify tag_name and name since it's already created.
          # We just upload the files to the current event's release.
          tag_name: ${{ steps.version.outputs.IS_RELEASE_EVENT == 'true' && github.event.release.tag_name || format('v{0}', steps.version.outputs.VERSION) }}
          name: ${{ steps.version.outputs.IS_RELEASE_EVENT == 'true' && github.event.release.name || format('Firmware Update v{0}', steps.version.outputs.VERSION) }}
          body: ${{ steps.version.outputs.IS_RELEASE_EVENT == 'true' && github.event.release.body || 'Automated OTA firmware pre-release from CI/CD pipeline.' }}
          draft: false
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}
          files: .pio/build/esp32dev/firmware.bin
          token: ${{ secrets.GITHUB_TOKEN }}
